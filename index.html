<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SI BELPA NGAPAIN JIR</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #0a0014, #1b0033);
            color: white;
        }

        .container {
            padding: 30px;
        }

        .title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .card {
            width: 300px;
            background: #0f0f0f;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(128, 0, 255, 0.3);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            display: block;
            object-fit: contain;
        }

        .menu-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .menu-desc {
            text-align: center;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: #7a2cff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #9a5cff;
        }

        pre {
            margin-top: 15px;
            background: #16002a;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            color: #d6b8ff;
            overflow-x: auto;
            display: none;
        }
    </style>
</head>
<body>
  <div class="card">
    <img src="wkwk.png" class="logo">

    <div class="menu-title">PMM</div>

    <button class="btn" onclick="toggleKode('pesan1', kodePMM)">
        ngisor
    </button>

    <pre id="pesan1"></pre>
</div>

<div class="card">
    <img src="se2.png" class="logo">

    <div class="menu-title">SERVO PANTEKK</div>

    <button class="btn" onclick="toggleKode('pesan2', kode2)">
        ngisor
    </button>

    <pre id="pesan2"></pre>
</div>
<script>
    const kodePMM = `#include <ThreeWire.h>
#include <RtcDS1302.h>
#include <TM1637Display.h>

#define CLK 2
#define DIO 3
TM1637Display display(CLK, DIO);

ThreeWire myWire(7, 6, 8);
RtcDS1302<ThreeWire> Rtc(myWire);

void setup() {
  display.setBrightness(0x0f);
  Rtc.Begin();
}

void loop() {
  RtcDateTime now = Rtc.GetDateTime();

  int jamMenit = (now.Hour() * 100) + now.Minute();

  static bool showColon = true;

  display.showNumberDecEx(
    jamMenit,
    showColon ? 0x40 : 0x00,
    true
  );

  showColon = !showColon;
  delay(1000);
}`;

    const kode2 = `#include <Servo.h>

Servo servol;

#define switchl 3
#define switch2 4

const int led = 1;
const int ledd = 2;

void setup() {
  pinMode(switchl, INPUT_PULLUP);
  pinMode(switch2, INPUT_PULLUP);

  pinMode(led, OUTPUT);
  pinMode(ledd, OUTPUT);

  servol.attach(7);
  servol.write(90);
}

void loop() {

  if (digitalRead(switchl) == LOW) {
    digitalWrite(led, HIGH);

    servol.write(90);
    delay(1000);
    servol.write(180);
    delay(1000);
    servol.write(90);
    delay(1000);

    digitalWrite(led, LOW);
    delay(1000);
  }

  else if (digitalRead(switch2) == LOW) {
    digitalWrite(ledd, HIGH);

    servol.write(90);
    delay(1000);
    servol.write(0);
    delay(1000);
    servol.write(90);
    delay(1000);

    digitalWrite(ledd, LOW);
    delay(1000);
  }
}
`;

    function toggleKode(id, kode) {
        const el = document.getElementById(id);

        if (el.style.display === "block") {
            el.style.display = "none";
        } else {
            el.textContent = kode;
            el.style.display = "block";
        }
    }
</script>

</body>
</html>
